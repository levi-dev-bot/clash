;==========================================================
; Clash-LIAN.ini —— OpenClash / subconverter 规则模板
; 维护：levi-dev-bot/clash（源自 lee-win/clash，已重构）
; 更新：2026-10-27
;
; 相对 lee-win 原版的改动：
;   1. AI 规则源换成本仓库融合版 180 条（补 arkoselabs/statsig/featuregates 等风控域名）
;   2. 新增 AI-IP.list：IP-CIDR/IP-ASN 单独拆文件，避免 domain behavior 报错
;   3. 新增「美国-固定」组：fallback + 3600s 探活，出口不按延迟漂移
;   4. AI 组默认选中「美国-固定」（原来默认 DIRECT）
;   5. ruleset 全部指向本仓库，不再引用 lee-win
;==========================================================

;1、域名组
