; 美国-固定 —— AI 专用，出口稳定优先于速度
;   fallback：只在前一个节点探测失败时才切，不像 url-test 按延迟频繁漂移
;   interval 3600s：一小时才探活一次，减少出口跳变
;   收录范围（按实测质量排序）：
;    美国0X丨V6   → 落地 23.45.12.24/35 美国LA Akamai，欺诈分 0（最优）
;    美国0X原生    → 落地 172.236.240.142/242.54 美国LA Akamai，欺诈分 24 Medium
;    美国|0X      → naiko anytls，未实测
;  故意排除：
;    美国0X丨专线 / IPLC → 入口在国内福州 222.79.111.x，落地测不到，有中国出口风险
;    美国真家宽          → 同上（入口也在国内专线）
custom_proxy_group=美国-固定`fallback`(美国0[1-9]丨V6|美国0[1-9]原生|美国\|0[1-9])`http://www.gstatic.com/generate_204`3600,150

; 美国-家宽 —— 备用，手动切；入口在国内专线，落地需自行实测
custom_proxy_group=美国-家宽`select`[]美国-固定`[]🇺🇸【北美洲】美国真家宽01丨专线【6x】`[]🇺🇸【北美洲】美国真家宽02丨专线【6x】`[]🇺🇸【北美洲】美国05丨IPLC【10x】`[]🇺🇸【北美洲】美国06丨IPLC【10x】

;4、启用规则集
enable_rule_generator=true
overwrite_original_rules=true
